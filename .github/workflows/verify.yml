      - name: Payroll screens and financial archive
        run: |
          node tests/browser-payroll.mjs
          node tests/payroll-archive.mjs
        env:
          COASTER_EVIDENCE: ${{ runner.temp }}/payroll-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
