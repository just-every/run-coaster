name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      COASTER_SHARD: '1/2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: bash scripts/ci/install-browser.sh
      - run: pnpm run verify

  coaster_flows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      COASTER_SHARD: '2/2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - name: HTTP flow suite, second half
        run: pnpm run test:coaster

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: bash scripts/ci/install-browser.sh
      - name: Browser journeys, restore and fresh-clone verbs
        run: node tests/browser.mjs
        env:
          COASTER_EVIDENCE: ${{ runner.temp }}/coaster-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coaster-browser-proof
          path: ${{ runner.temp }}/coaster-proof

  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        refusals: ['0/3', '1/3', '2/3']
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: bash scripts/ci/install-browser.sh
      - name: Receipt inbox journeys, lifecycle archive refusals and restore
        run: node tests/capture.mjs
        env:
          COASTER_EVIDENCE: ${{ runner.temp }}/capture-proof
          CAPTURE_REFUSALS: ${{ matrix.refusals }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coaster-capture-proof-${{ strategy.job-index }}
          path: ${{ runner.temp }}/capture-proof

  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: bash scripts/ci/install-browser.sh
      - name: Keyboard-only journeys and axe on every main screen
        run: node tests/accessibility.mjs
        env:
          COASTER_EVIDENCE: ${{ runner.temp }}/accessibility-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coaster-accessibility-proof
          path: ${{ runner.temp }}/accessibility-proof

  cash_drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: bash scripts/ci/install-browser.sh
      - name: Cash-window screens, scheduled drafts and archive replay
        run: node tests/capture-cash.mjs
        env:
          COASTER_EVIDENCE: ${{ runner.temp }}/cash-draft-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coaster-cash-draft-proof
          path: ${{ runner.temp }}/cash-draft-proof

  policy_signals:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: bash scripts/ci/install-browser.sh
      - name: Combined 300-expense detector acceptance
        run: node tests/policy-signals-scale.mjs
      - name: Receipt/spend signal evidence, review and payment screens
        run: node tests/policy-signals-browser.mjs
        env:
          COASTER_EVIDENCE: ${{ runner.temp }}/policy-signals-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coaster-policy-signals-proof
          path: ${{ runner.temp }}/policy-signals-proof

  card_matching:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        refusals: ['0/3', '1/3', '2/3']
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: bash scripts/ci/install-browser.sh
      - name: Card matching consent, questions, undo and archive replay
        run: node tests/card-matching.mjs
        env:
          COASTER_EVIDENCE: ${{ runner.temp }}/card-matching-proof
          MATCH_REFUSALS: ${{ matrix.refusals }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coaster-card-matching-proof-${{ strategy.job-index }}
          path: ${{ runner.temp }}/card-matching-proof

  policy_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: bash scripts/ci/install-browser.sh
      - name: Policy envelopes, mixed approvals, agreement, revocation and archive authority
        run: node tests/browser-policy-review.mjs
        env:
          COASTER_EVIDENCE: ${{ runner.temp }}/policy-review-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coaster-policy-review-proof
          path: ${{ runner.temp }}/policy-review-proof

  verify:
    if: always()
    needs: [app, coaster_flows, browser, capture, accessibility, cash_drafts, policy_signals, card_matching, policy_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complete Verify wall
        env:
          APP_RESULT: ${{ needs.app.result }}
          COASTER_FLOWS_RESULT: ${{ needs.coaster_flows.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CAPTURE_RESULT: ${{ needs.capture.result }}
          ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
          CASH_DRAFT_RESULT: ${{ needs.cash_drafts.result }}
          POLICY_SIGNALS_RESULT: ${{ needs.policy_signals.result }}
          POLICY_REVIEW_RESULT: ${{ needs.policy_review.result }}
          CARD_MATCHING_RESULT: ${{ needs.card_matching.result }}
        run: test "$APP_RESULT" = success && test "$COASTER_FLOWS_RESULT" = success && test "$BROWSER_RESULT" = success && test "$CAPTURE_RESULT" = success && test "$ACCESSIBILITY_RESULT" = success && test "$CASH_DRAFT_RESULT" = success && test "$POLICY_SIGNALS_RESULT" = success && test "$CARD_MATCHING_RESULT" = success && test "$POLICY_REVIEW_RESULT" = success
